name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install pinned Rust and nightly formatter
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup toolchain install nightly --profile minimal --component rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-audit,cargo-deny,cargo-fuzz
      - name: Enable pinned package manager
        run: corepack enable
      - name: Verify complete stack
        run: make verify

  deterministic:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Verify deterministic corpus hashes
        run: cargo test -p svg2excal-core --test determinism

  fuzz:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install fuzz toolchain
        run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Run all bounded fuzz campaigns
        run: FUZZ_SECONDS=60 make fuzz

  benchmark:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Run regression benchmarks
        run: make bench

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, deterministic]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest --strip header
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.git-cliff.outputs.content }}
